[project]
name = "pollie"
version = "0.1.0"
description = "A small polls application (web, API, worker, PostgreSQL, Redis) for the Ironhack DevOps bootcamp"
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = { text = "MIT" }

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: needs real PostgreSQL and Redis (set DATABASE_URL and REDIS_URL)"]

[tool.coverage.run]
source = ["pollie"]
omit = ["pollie/api/__main__.py", "pollie/worker/__main__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
