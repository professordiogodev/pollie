<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pollie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Pollie</h1>
    <p class="tag">Ask a question. Get answers.</p>
  </header>

  <main>
    <section id="create" class="card">
      <h2>New poll</h2>
      <form id="create-form">
        <label>Question <input id="question" maxlength="200" required placeholder="Tabs or spaces?"></label>
        <label>Options (one per line, at least 2)
          <textarea id="options" rows="4" required placeholder="Tabs&#10;Spaces"></textarea>
        </label>
        <button type="submit">Create poll</button>
        <p id="create-error" class="error" hidden></p>
      </form>
    </section>

    <section id="polls"><h2>Polls</h2><div id="poll-list"><p class="muted">Loading...</p></div></section>
  </main>

  <footer><span id="status" class="muted">checking API...</span> <span class="muted">· <span id="version"></span></span></footer>
  <script type="module" src="app.js"></script>
</body>
</html>
